<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Exam Performance</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Student Exam Performance Indicator</h1>

        <div class="card">

            <h2>Student Exam Performance Prediction</h2>

            <form action="{{url_for('predict_data')}}" method="post">

                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" required>
                        <option value="" selected disabled>Select your Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="ethnicity">Race or Ethnicity</label>
                    <select id="ethnicity" name="ethnicity" required>
                        <option value="" selected disabled>Select Ethnicity</option>
                        <option value="group A">Group A</option>
                        <option value="group B">Group B</option>
                        <option value="group C">Group C</option>
                        <option value="group D">Group D</option>
                        <option value="group E">Group E</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="parent_education">
                        Parental Level of Education
                    </label>

                    <select id="parent_education" name="parent_education" required>
                        <option value="" selected disabled>
                            Select Parent Education
                        </option>

                        <option value="some high school">
                            Some High School
                        </option>

                        <option value="high school">
                            High School
                        </option>

                        <option value="some college">
                            Some College
                        </option>

                        <option value="associate's degree">
                            Associate's Degree
                        </option>

                        <option value="bachelor's degree">
                            Bachelor's Degree
                        </option>

                        <option value="master's degree">
                            Master's Degree
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="lunch">Lunch Type</label>

                    <select id="lunch" name="lunch" required>
                        <option value="" selected disabled>
                            Select Lunch Type
                        </option>

                        <option value="standard">Standard</option>
                        <option value="free/reduced">Free/Reduced</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="test_course">
                        Test Preparation Course
                    </label>

                    <select id="test_course" name="test_course" required>
                        <option value="" selected disabled>
                            Select Test Course
                        </option>

                        <option value="none">None</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="writing_score">
                        Writing Score out of 100
                    </label>

                    <input
                        type="number"
                        id="writing_score"
                        name="writing_score"
                        placeholder="Enter your score"
                        min="0"
                        max="100"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="reading_score">
                        Reading Score out of 100
                    </label>

                    <input
                        type="number"
                        id="reading_score"
                        name="reading_score"
                        placeholder="Enter your score"
                        min="0"
                        max="100"
                        required
                    >
                </div>

                <button type="submit">
                    Predict your Maths Score
                </button>

            </form>

            {% if results %}
                <div class="result">
                    <span>The prediction is</span>
                    <strong>{{ results }}</strong>
                </div>
            {% endif %}

        </div>

    </div>

</body>
</html>
